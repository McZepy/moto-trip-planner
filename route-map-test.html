<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      MotoRoute - Route Map Test
    </title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family:
          Inter,
          system-ui,
          sans-serif;
      }

      body {
        overflow:
          hidden;
        background:
          #111111;
      }

      #map {
        position:
          absolute;
        inset:
          0;
      }

      #summary {
        position:
          absolute;
        z-index:
          10;
        top:
          18px;
        left:
          18px;
        width:
          min(
            360px,
            calc(
              100vw - 36px
            )
          );
        padding:
          14px 16px;
        border:
          1px solid
          #333333;
        border-radius:
          10px;
        background:
          rgba(
            17,
            17,
            17,
            0.94
          );
        color:
          #f5f5f5;
        box-shadow:
          0 12px 35px
          rgba(
            0,
            0,
            0,
            0.30
          );
      }

      #summary
      > div {
        margin-top:
          6px;
        color:
          #d4d4d4;
        font-size:
          13px;
      }

      .legend {
        display:
          flex;
        gap:
          16px;
        padding-top:
          6px;
        border-top:
          1px solid
          #333333;
      }

      .legend span {
        display:
          flex;
        align-items:
          center;
        gap:
          7px;
        font-size:
          11px;
      }

      .legend i {
        display:
          inline-block;
        width:
          28px;
        height:
          4px;
        border-radius:
          2px;
      }

      .legend .road {
        background:
          #2563eb;
      }

      .legend .ferry {
        height:
          0;
        border-top:
          4px dashed
          #f97316;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <div id="summary">
      Calcolo percorso...
    </div>

    <script
      type="module"
      src="/src/dev/routeMapTest.ts"
    ></script>
  </body>
</html>
