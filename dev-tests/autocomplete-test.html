<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      MotoRoute - Port Search UX Test
    </title>

    <style>
      * {
        box-sizing:
          border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        background: #111111;
        color: #f5f5f5;
        font-family:
          Inter,
          system-ui,
          sans-serif;
      }

      main {
        max-width:
          850px;
        margin:
          0 auto;
      }

      h1 {
        margin:
          0 0 8px;
      }

      p {
        color:
          #bdbdbd;
      }

      .quick {
        display:
          flex;
        flex-wrap:
          wrap;
        gap:
          8px;
        margin:
          18px 0;
      }

      .quick button {
        border:
          1px solid #3f3f3f;
        border-radius:
          7px;
        padding:
          7px 10px;
        background:
          #202020;
        color:
          #f5f5f5;
        cursor:
          pointer;
      }

      input {
        width:
          100%;
        height:
          46px;
        padding:
          0 14px;
        border:
          1px solid #555555;
        border-radius:
          9px;
        background:
          #181818;
        color:
          #ffffff;
        font-size:
          16px;
      }

      #status {
        min-height:
          24px;
        padding:
          8px 2px;
        color:
          #a3a3a3;
        font-size:
          13px;
      }

      #results {
        display:
          grid;
        gap:
          16px;
      }

      .group {
        display:
          grid;
        gap:
          8px;
      }

      .group h2 {
        margin:
          8px 0 0;
        color:
          #a3a3a3;
        font-size:
          11px;
        letter-spacing:
          0.08em;
      }

      .group-list {
        display:
          grid;
        gap:
          7px;
      }

      .result {
        display:
          grid;
        gap:
          4px;
        width:
          100%;
        padding:
          12px 14px;
        border:
          1px solid #353535;
        border-radius:
          9px;
        background:
          #1b1b1b;
        color:
          #ffffff;
      }

      .group:first-child
      .result {
        border-color:
          #f97316;
        background:
          rgba(
            249,
            115,
            22,
            0.08
          );
      }

      .result strong {
        font-size:
          14px;
      }

      .result small {
        color:
          #bdbdbd;
      }

      .coordinates,
      .source {
        color:
          #777777 !important;
      }

      .badge {
        width:
          max-content;
        border-radius:
          999px;
        padding:
          2px 7px;
        background:
          #26344f;
        color:
          #93c5fd;
        font-size:
          9px;
        font-weight:
          800;
      }

      .badge.ferry {
        background:
          #4a2712;
        color:
          #fb923c;
      }

      .empty,
      .error {
        padding:
          14px;
        border:
          1px solid #353535;
        border-radius:
          9px;
        color:
          #bdbdbd;
      }

      .error {
        color:
          #fca5a5;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>
        MotoRoute · Port Search UX Test
      </h1>

      <p>
        Obiettivo: ricerca tipo Google Maps,
        ma con terminal traghetti ordinati
        per utilità motociclistica.
      </p>

      <div class="quick">
        <button
          type="button"
          data-query="Porto di Genova"
        >
          Porto di Genova
        </button>

        <button
          type="button"
          data-query="Porto di Hirtshals"
        >
          Porto di Hirtshals
        </button>

        <button
          type="button"
          data-query="Viganò"
        >
          Viganò
        </button>

        <button
          type="button"
          data-query="Via della Bandagera 6, Viganò"
        >
          Via della Bandagera 6
        </button>

        <button
          type="button"
          data-query="Lecco"
        >
          Lecco
        </button>
      </div>

      <input
        id="query"
        type="text"
        autocomplete="off"
        placeholder="Es. Porto di Genova, Via Roma 10, Lecco..."
      />

      <div id="status">
        In attesa.
      </div>

      <div id="results"></div>
    </main>

    <script
      type="module"
      src="/src/dev/autocompleteTest.ts"
    ></script>
  </body>
</html>
