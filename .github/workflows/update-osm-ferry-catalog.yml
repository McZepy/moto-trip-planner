name: Update OSM ferry catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
  push:
    paths:
      - 'scripts/build-osm-ferry-catalog.mjs'
      - '.github/workflows/update-osm-ferry-catalog.yml'

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build OSM ferry catalog
        run: node scripts/build-osm-ferry-catalog.mjs

      - name: Commit catalog if changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/data/osm-ferries-europe.json)" ]; then
            echo "Catalogo invariato"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/osm-ferries-europe.json
          git commit -m "data: aggiorna catalogo traghetti OSM [skip ci]"

          # Il branch può avanzare mentre il catalogo viene costruito.
          # Ribasiamo il commit dati prima del push per evitare non-fast-forward.
          git pull --rebase origin main
          git push origin HEAD:main
