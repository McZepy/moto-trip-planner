name: Apply TomTom runtime routing

on:
  push:
    paths:
      - 'scripts/apply-tomtom-routing-runtime.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply integration
        run: node scripts/apply-tomtom-routing-runtime.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit integration if changed
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx src/providers/tripRouteAlternatives.ts src/providers/multiLegTripPlanner.ts src/itinerary/tripDayRoutePlanner.ts; then
            echo "TomTom runtime già integrato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/providers/tripRouteAlternatives.ts src/providers/multiLegTripPlanner.ts src/itinerary/tripDayRoutePlanner.ts
          git commit -m "V0.6B - usa TomTom nel routing MotoRoute"
          git pull --rebase origin main
          git push
