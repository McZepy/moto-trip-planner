name: Apply imported day routing fix

on:
  push:
    paths:
      - 'scripts/apply-imported-day-routing-fix.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration
        run: node scripts/apply-imported-day-routing-fix.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit integration if changed
        shell: bash
        run: |
          if git diff --quiet -- src/providers/autocompleteProvider.ts src/itinerary/tripDayRoutePlanner.ts src/providers/tomTomRoutingProvider.ts src/dev/tomtom-routing-test.ts; then
            echo "Fix già integrato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/autocompleteProvider.ts src/itinerary/tripDayRoutePlanner.ts src/providers/tomTomRoutingProvider.ts src/dev/tomtom-routing-test.ts
          git commit -m "V0.6C - corregge giornate importate e traghetti locali"
          git pull --rebase origin main
          git push
