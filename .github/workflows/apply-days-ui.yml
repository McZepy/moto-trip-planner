name: Apply days UI integration

on:
  push:
    paths:
      - 'scripts/apply-days-ui.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply integration
        run: node scripts/apply-days-ui.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit integration if changed
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "App già integrata"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "V0.5B - integra Giornate e Hotel nell'app"
          git pull --rebase origin main
          git push
