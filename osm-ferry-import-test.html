<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      MotoRoute - OSM Ferry Importer Test
    </title>

    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #111111;
        color: #f5f5f5;
        font-family:
          Inter,
          system-ui,
          sans-serif;
      }

      #test-root {
        max-width: 920px;
        margin: 0 auto;
      }

      h1 {
        margin:
          0 0 12px;
        font-size: 24px;
      }

      h2 {
        margin:
          24px 0 10px;
        font-size: 17px;
      }

      .summary,
      .note {
        margin:
          0 0 14px;
        padding: 12px 14px;
        border-radius: 8px;
      }

      .ok-summary {
        background: #16351f;
        color: #86efac;
        font-weight: 700;
      }

      .ko-summary {
        background: #451a1a;
        color: #fca5a5;
        font-weight: 700;
      }

      .note {
        background: #1b1b1b;
        color: #bdbdbd;
        font-size: 13px;
        line-height: 1.5;
      }

      .test-row {
        display: grid;
        grid-template-columns:
          70px 1fr;
        gap: 14px;
        margin-bottom: 10px;
        padding: 14px;
        border:
          1px solid #333333;
        border-radius: 9px;
        background: #1b1b1b;
      }

      .test-status {
        font-weight: 800;
      }

      .test-row.ok
      .test-status {
        color: #86efac;
      }

      .test-row.ko
      .test-status {
        color: #fca5a5;
      }

      .test-detail {
        margin-top: 5px;
        color: #bdbdbd;
        font-size: 13px;
      }

      .routes {
        display: grid;
        gap: 7px;
      }

      .route-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 10px 12px;
        border:
          1px solid #333333;
        border-radius: 7px;
        background: #151515;
        color: #cfcfcf;
        font-size: 12px;
      }

      .route-row strong {
        color: #f5f5f5;
      }
    </style>
  </head>

  <body>
    <div id="test-root">
      Importazione LIVE da OpenStreetMap / Overpass...
    </div>

    <script
      type="module"
      src="/src/dev/osmFerryProxyImporterTest.ts"
    ></script>
  </body>
</html>
